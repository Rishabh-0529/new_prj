<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marks Entry</title>
    <style>
      :root {
        font-family: "Segoe UI", system-ui, sans-serif;
        color: #1f2937;
        background-color: #f9fafb;
      }

      body {
        margin: 0;
        padding: 0;
      }

      .page {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px 16px;
      }

      .card {
        width: min(520px, 92vw);
        background: #ffffff;
        border-radius: 16px;
        box-shadow: 0 16px 40px rgba(15, 23, 42, 0.15);
        padding: 32px;
      }

      h1 {
        margin-top: 0;
        margin-bottom: 8px;
        font-size: 1.8rem;
      }

      p {
        margin-top: 0;
        margin-bottom: 24px;
        color: #4b5563;
      }

      label {
        font-weight: 600;
        display: block;
        margin-bottom: 6px;
      }

      input {
        width: 100%;
        padding: 12px;
        border-radius: 10px;
        border: 1px solid #d1d5db;
        font-size: 1rem;
        box-sizing: border-box;
        margin-bottom: 16px;
      }

      button {
        width: 100%;
        padding: 12px 16px;
        border: none;
        border-radius: 10px;
        background: #2563eb;
        color: #ffffff;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
      }

      .banner {
        padding: 12px 14px;
        border-radius: 10px;
        margin-bottom: 16px;
        font-weight: 600;
      }

      .banner.success {
        background: #dcfce7;
        color: #166534;
      }

      .banner.error {
        background: #fee2e2;
        color: #991b1b;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <main class="card">
        <h1>Marks Entry</h1>
        <p>Enter student marks and submit to append to the CSV file.</p>

        {% if submitted %}
        <div class="banner success">Saved! Your marks were appended.</div>
        {% endif %}

        {% if error %}
        <div class="banner error">{{ error }}</div>
        {% endif %}

        <form method="post">
          <label for="student_name">Student name</label>
          <input
            id="student_name"
            name="student_name"
            placeholder="e.g. Priya Sharma"
            value="{{ form_data.student_name if form_data }}"
            required
          />

          <label for="subject">Subject</label>
          <input
            id="subject"
            name="subject"
            placeholder="e.g. Mathematics"
            value="{{ form_data.subject if form_data }}"
            required
          />

          <label for="marks">Marks</label>
          <input
            id="marks"
            name="marks"
            placeholder="e.g. 95"
            value="{{ form_data.marks if form_data }}"
            required
          />

          <button type="submit">Save to CSV</button>
        </form>
      </main>
    </div>
  </body>
</html>
